[project]
name = "flow-clone"
version = "0.1.0"
description = "Local Wispr Flow clone: hold-to-talk dictation for macOS"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
